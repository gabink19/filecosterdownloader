              /** Putar video yang sudah selesai diunduh; semua video selesai lainnya jadi daftar putar. */
              void playDone(int i) {
                  if (i < 0 || i >= vState.length || vState[i] != ST_DONE) return;
                  if (!doneUri.containsKey(i)) {
                      setStatus("File ini bisa diputar dari tab Pemutar.", Ui.AMBER);
                      return;
                  }
                  ArrayList<String> uris = new ArrayList<>(), names = new ArrayList<>();
                  int start = 0;
                  for (int k = 0; k < vState.length; k++) {
                      String u = doneUri.get(k);
                      if (u == null || vState[k] != ST_DONE) continue;
                      if (k == i) start = uris.size();
                      uris.add(u);
                      names.add(rName != null && k < rName.length && rName[k] != null ? rName[k] : "Video " + (k + 1));
                  }
                  PlayerActivity.open(this, uris, names, start, null, null);
              }

              /** Muat semua video di HP (seperti pustaka VLC), terbaru di atas. */
              void loadLibrary() {
                  String perm = Build.VERSION.SDK_INT >= 33 ? "android.permission.READ_MEDIA_VIDEO"
                          : Manifest.permission.READ_EXTERNAL_STORAGE;
                  if (checkSelfPermission(perm) != PackageManager.PERMISSION_GRANTED) {
                      renderLibrary("Izinkan akses video agar daftar video di HP bisa ditampilkan.");
                      requestPermissions(new String[]{perm}, REQ_LIBRARY);
                      return;
                  }
                  renderLibrary("Memuat daftar video ...");
                  final int s = ++libSeq;
                  final ContentResolver cr = getContentResolver();
                  bg.execute(() -> {
                      final List<String[]> out = queryVideos(cr);
                      h.post(() -> {
                          if (s != libSeq) return;
                          libItems.clear();
                          libItems.addAll(out);
                          renderLibrary(null);
                      });
                  });
              }

              static List<String[]> queryVideos(ContentResolver cr) {
                  List<String[]> out = new ArrayList<>();
                  Uri coll = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                  String[] proj = {MediaStore.Video.Media._ID, MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.DURATION,
                          MediaStore.Video.Media.SIZE, MediaStore.Video.Media.BUCKET_DISPLAY_NAME};
                  try (Cursor c = cr.query(coll, proj, null, null, MediaStore.Video.Media.DATE_ADDED + " DESC")) {
                      if (c == null) return out;
                      while (c.moveToNext() && out.size() < MAX_LIBRARY) {
                          long id = c.getLong(0);
                          String name = c.isNull(1) ? "video" : c.getString(1);
                          long dur = c.isNull(2) ? 0 : c.getLong(2);
                          long size = c.isNull(3) ? -1 : c.getLong(3);
                          String folder = c.isNull(4) ? "" : c.getString(4);
                          String info = (dur > 0 ? PlayerActivity.fmt(dur) + " \u00B7 " : "") + fmtSize(size)
                                  + (folder.isEmpty() ? "" : " \u00B7 " + folder);
                          out.add(new String[]{ContentUris.withAppendedId(coll, id).toString(), name, info, String.valueOf(id)});
                      }
                  } catch (Exception ignored) { }
                  return out;
              }

              void renderLibrary(String msg) {
                  if (libBox == null) return;
                  libBox.removeAllViews();
                  tabPlayer.setText(msg == null && !libItems.isEmpty() ? "Pemutar (" + libItems.size() + ")" : "Pemutar");
                  if (msg != null || libItems.isEmpty()) {
                      TextView e = Ui.hint(this, msg != null ? msg : "Belum ada video di HP. Video yang kamu unduh akan muncul di sini.");
                      e.setPadding(dp(4), dp(8), dp(4), dp(8));
                      libBox.addView(e);
                      return;
                  }
                  final int s = libSeq;
                  for (int k = 0; k < libItems.size(); k++) {
                      final int idx = k;
                      final String[] it = libItems.get(k);
                      LinearLayout r = Ui.row(this);
                      r.setBackground(Ui.box(this, Ui.PANEL, 10, 0));
                      r.setPadding(dp(8), dp(8), dp(10), dp(8));
                      ImageView th = new ImageView(this);
                      th.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      th.setBackground(Ui.box(this, Color.BLACK, 6, 0));
                      th.setClipToOutline(true);
                      r.addView(th, new LinearLayout.LayoutParams(dp(112), dp(63)));
                      LinearLayout mid = Ui.col(this);
                      mid.setPadding(dp(12), 0, 0, 0);
                      TextView t = Ui.text(this, it[1], 14, Ui.TEXT, Ui.BODY);
                      t.setMaxLines(2);
                      t.setEllipsize(TextUtils.TruncateAt.END);
                      mid.addView(t);
                      mid.addView(Ui.hint(this, it[2]), Ui.fill(this, 2));
                      r.addView(mid, Ui.weight(1));
                      r.setOnClickListener(v -> playLibrary(idx));
                      libBox.addView(r, Ui.fill(this, 6));
                      loadThumb(th, it[0], it[3], s);
                  }
              }

              @SuppressWarnings("deprecation")
              void loadThumb(final ImageView iv, final String uri, final String id, final int s) {
                  final ContentResolver cr = getContentResolver();
                  bg.execute(() -> {
                      android.graphics.Bitmap b = null;
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              b = cr.loadThumbnail(Uri.parse(uri), new android.util.Size(224, 126), null);
                          } else {
                              b = MediaStore.Video.Thumbnails.getThumbnail(cr, Long.parseLong(id),
                                      MediaStore.Video.Thumbnails.MINI_KIND, null);
                          }
                      } catch (Exception ignored) { }
                      final android.graphics.Bitmap fb = b;
                      if (fb != null) h.post(() -> { if (s == libSeq) iv.setImageBitmap(fb); });
                  });
              }

