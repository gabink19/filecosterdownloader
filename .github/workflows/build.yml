              void stopCapture() {
                  mode = Mode.IDLE;
                  paused = false;
                  for (Worker w : workers) {
                      if (w.active && w.item >= 0 && w.item < vState.length && vState[w.item] == ST_SEARCH) setState(w.item, ST_WAIT, "");
                  }
                  releaseWorkers();
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
