                          TextView g = Ui.text(this, lastRel.isEmpty() ? "Folder utama" : lastRel, 13, Ui.ION, Ui.MEDIUM);
                          g.setPadding(dp(4), 0, 0, 0);
                          listBox.addView(g, Ui.fill(this, i == 0 ? 4 : 16));
                      }
