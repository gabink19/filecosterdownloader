# Filecoster Downloader - build APK otomatis di GitHub.
# v3.2: tampilan baru yang sederhana (Unduh / Video saya / Lainnya), pemutar ala VLC lebih lengkap
#       (equalizer, subtitle file, timer tidur, A-B, tangkap layar, dll.), penanda sudah ditonton,
#       lanjutkan menonton, PIN diminta setiap kali aplikasi kembali dibuka, ukuran video tampil sebelum diunduh.
# v3.1: pembaruan lebih andal: cek kunci tanda tangan sebelum memasang, cadangan lewat penginstal
#       APK bawaan Android, kode error pemasangan dicatat.
# v3.0: halaman web memakai DNS Google 8.8.8.8 (lewat DNS-over-HTTPS), bisa dimatikan di Pengaturan.
# v2.9: PIN 6 digit (PIN salah = aplikasi tampil kosong seperti baru dipasang), tab Pemutar hanya berisi
#       video yang diunduh lewat aplikasi, dengan tampilan Thumbnail atau Daftar.
# v2.8: pemutar video ala VLC (gestur volume/kecerahan/geser, kunci layar, kecepatan, audio & subtitle),
#       tab Pemutar (semua video di HP), pembaruan aplikasi langsung dari dalam aplikasi.
#       Agar pembaruan bisa dipasang, isi Secrets: SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD,
#       SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (kunci tanda tangan tetap).
# v2.7: mode "Buka & deteksi video" seperti IDM (semua video yang dimuat halaman bisa diunduh),
#       dukungan stream HLS/m3u8 (termasuk enkripsi AES-128), link bisa dibagikan dari aplikasi lain.
# v2.6: tanpa notifikasi unduhan sistem, opsi layar web gelap, pilihan 6 proses (dengan peringatan),
#       layar tidak lagi loncat ke pratinjau web.
# v2.5: pengumpulan link bisa berjalan paralel (beberapa proses sekaligus), jumlahnya disesuaikan
#       dengan spesifikasi HP (RAM + inti CPU) lengkap dengan rekomendasi.
# Cukup simpan file ini sebagai .github/workflows/build.yml di repository baru.
# Setiap kali di-commit, GitHub akan membuat APK dan menaruhnya di halaman Releases.

name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Memakai $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci tanda tangan APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fc-release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/fc-release.jks" >> "$GITHUB_ENV"
            echo "APK ditandatangani dengan kunci tetap dari Secrets."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 belum diisi. APK memakai kunci debug acak, jadi pembaruan dari dalam aplikasi akan ditolak Android."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FilecosterDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FilecosterDownloader
          path: FilecosterDownloader.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Filecoster Downloader (build ${{ github.run_number }})
          files: FilecosterDownloader.apk
