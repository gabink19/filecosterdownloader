# Filecoster Downloader - build APK otomatis di GitHub.
# Cukup simpan file ini sebagai .github/workflows/build.yml di repository baru.
# Setiap kali di-commit, GitHub akan membuat APK dan menaruhnya di halaman Releases.

name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Buat source project Android
        run: |
          cat > settings.gradle << 'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FilecosterDownloader'
          include ':app'
          EOF_FILE

          cat > build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE

          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF_FILE

          mkdir -p app
          cat > app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.fcdownloader'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.fcdownloader'
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName '2.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF_FILE

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:label="Filecoster Downloader"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_FILE

          mkdir -p app/src/main/java/com/example/fcdownloader
          cat > app/src/main/java/com/example/fcdownloader/Ui.java << 'EOF_FILE'
          package com.example.fcdownloader;

          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Spinner;
          import android.widget.TextView;

          /** Palet & komponen tampilan "panel kendali" bertema samudra malam. */
          final class Ui {
              // palet
              static final int ABYSS = Color.parseColor("#0A1024");   // latar
              static final int PANEL = Color.parseColor("#121A35");   // kartu
              static final int PANEL_HI = Color.parseColor("#18224A");
              static final int LINE = Color.parseColor("#26325E");    // garis/track
              static final int ION = Color.parseColor("#4FE3D4");     // aksi utama, selesai
              static final int ION_DEEP = Color.parseColor("#0E3B46");
              static final int AMBER = Color.parseColor("#FFC857");   // sedang berjalan
              static final int PULSE = Color.parseColor("#FF5C8A");   // gagal / berhenti
              static final int TEXT = Color.parseColor("#E6ECFF");
              static final int MUTED = Color.parseColor("#8A95BE");

              static final Typeface DISPLAY = Typeface.create("sans-serif-condensed", Typeface.BOLD);
              static final Typeface MEDIUM = Typeface.create("sans-serif-medium", Typeface.NORMAL);
              static final Typeface BODY = Typeface.create("sans-serif", Typeface.NORMAL);

              private Ui() { }

              static int dp(Context c, float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, c.getResources().getDisplayMetrics()));
              }

              static GradientDrawable box(Context c, int fill, float radiusDp, int stroke) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(c, radiusDp));
                  if (stroke != 0) g.setStroke(dp(c, 1), stroke);
                  return g;
              }

              static LinearLayout.LayoutParams lp(int w, int h) {
                  return new LinearLayout.LayoutParams(w, h);
              }

              static LinearLayout.LayoutParams weight(float w) {
                  return new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, w);
              }

              static LinearLayout.LayoutParams fill(Context c, int topDp) {
                  LinearLayout.LayoutParams p = lp(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.topMargin = dp(c, topDp);
                  return p;
              }

              static LinearLayout col(Context c) {
                  LinearLayout l = new LinearLayout(c);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              static LinearLayout row(Context c) {
                  LinearLayout l = new LinearLayout(c);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER_VERTICAL);
                  return l;
              }

              /** Kartu panel dengan sudut agak tegas; kartu utama memakai garis tepi. */
              static LinearLayout card(Context c, boolean outlined) {
                  LinearLayout l = col(c);
                  l.setBackground(box(c, PANEL, 14, outlined ? LINE : 0));
                  int p = dp(c, 16);
                  l.setPadding(p, p, p, p);
                  return l;
              }

              static TextView text(Context c, String s, float sp, int color, Typeface tf) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setTypeface(tf);
                  return t;
              }

              static TextView title(Context c, String s) {
                  TextView t = text(c, s, 17, TEXT, DISPLAY);
                  t.setLetterSpacing(0.02f);
                  return t;
              }

              static TextView hint(Context c, String s) {
                  TextView t = text(c, s, 12.5f, MUTED, BODY);
                  t.setLineSpacing(0, 1.15f);
                  return t;
              }

              static EditText input(Context c, String hintText) {
                  EditText e = new EditText(c);
                  e.setHint(hintText);
                  e.setSingleLine(true);
                  e.setTextSize(15);
                  e.setTextColor(TEXT);
                  e.setHintTextColor(Color.parseColor("#5B6690"));
                  e.setTypeface(BODY);
                  e.setBackground(box(c, ABYSS, 10, LINE));
                  int h = dp(c, 12);
                  e.setPadding(h, dp(c, 11), h, dp(c, 11));
                  return e;
              }

              /** Tombol utama: blok ion terang dengan teks gelap. */
              static TextView primary(Context c, String s) {
                  TextView b = text(c, s, 16, ABYSS, DISPLAY);
                  b.setLetterSpacing(0.03f);
                  b.setGravity(Gravity.CENTER);
                  b.setMinHeight(dp(c, 54));
                  b.setBackground(box(c, ION, 12, 0));
                  b.setClickable(true);
                  b.setFocusable(true);
                  return b;
              }

              static void stylePrimary(Context c, TextView b, int fill, int textColor) {
                  b.setBackground(box(c, fill, 12, 0));
                  b.setTextColor(textColor);
              }

              /** Tombol sekunder bergaris. */
              static TextView ghost(Context c, String s) {
                  TextView b = text(c, s, 14, ION, MEDIUM);
                  b.setGravity(Gravity.CENTER);
                  int h = dp(c, 14);
                  b.setPadding(h, dp(c, 10), h, dp(c, 10));
                  b.setBackground(box(c, Color.TRANSPARENT, 10, LINE));
                  b.setClickable(true);
                  b.setFocusable(true);
                  return b;
              }

              static TextView chip(Context c) {
                  TextView t = text(c, "", 11.5f, MUTED, MEDIUM);
                  int h = dp(c, 9);
                  t.setPadding(h, dp(c, 3), h, dp(c, 4));
                  t.setSingleLine(true);
                  return t;
              }

              static void setChip(Context c, TextView t, String s, int color) {
                  t.setText(s);
                  t.setTextColor(color);
                  t.setBackground(box(c, (color & 0x00FFFFFF) | 0x22000000, 20, (color & 0x00FFFFFF) | 0x66000000));
              }

              static CheckBox check(Context c, String s, boolean on) {
                  CheckBox b = new CheckBox(c);
                  b.setText(s);
                  b.setTextColor(TEXT);
                  b.setTextSize(14);
                  b.setTypeface(BODY);
                  b.setChecked(on);
                  b.setButtonTintList(ColorStateList.valueOf(ION));
                  return b;
              }

              static Spinner spinner(Context c, String[] items) {
                  Spinner s = new Spinner(c, Spinner.MODE_DROPDOWN);
                  s.setAdapter(new ArrayAdapter<String>(c, android.R.layout.simple_list_item_1, items) {
                      @Override
                      public View getView(int pos, View v, ViewGroup parent) {
                          TextView t = (TextView) super.getView(pos, v, parent);
                          t.setTextColor(TEXT);
                          t.setTextSize(14);
                          t.setTypeface(BODY);
                          t.setSingleLine(true);
                          t.setEllipsize(TextUtils.TruncateAt.END);
                          t.setPadding(dp(c, 12), dp(c, 10), dp(c, 28), dp(c, 10));
                          return t;
                      }

                      @Override
                      public View getDropDownView(int pos, View v, ViewGroup parent) {
                          TextView t = (TextView) super.getDropDownView(pos, v, parent);
                          t.setTextColor(TEXT);
                          t.setTextSize(14);
                          t.setTypeface(BODY);
                          t.setSingleLine(false);
                          t.setPadding(dp(c, 14), dp(c, 12), dp(c, 14), dp(c, 12));
                          return t;
                      }
                  });
                  s.setBackground(box(c, ABYSS, 10, LINE));
                  s.setPopupBackgroundDrawable(box(c, PANEL_HI, 10, LINE));
                  return s;
              }
          }
          EOF_FILE

          mkdir -p app/src/main/java/com/example/fcdownloader
          cat > app/src/main/java/com/example/fcdownloader/RingView.java << 'EOF_FILE'
          package com.example.fcdownloader;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.BlurMaskFilter;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;
          import android.view.animation.LinearInterpolator;

          /**
           * Cincin pemindai: berputar saat memindai, lalu menjadi pengukur kemajuan
           * (ion = selesai, amber = sedang diunduh, merah = gagal).
           */
          public class RingView extends View {
              private float done, active, failed;
              private boolean spinning;
              private float sweep;
              private String big = "0", small = "";
              private ValueAnimator anim;

              private final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint arc = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint tick = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint tBig = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint tSmall = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF rect = new RectF();

              public RingView(Context c) {
                  super(c);
                  setLayerType(LAYER_TYPE_SOFTWARE, null); // perlu untuk efek pendar
                  track.setStyle(Paint.Style.STROKE);
                  track.setColor(Ui.LINE);
                  arc.setStyle(Paint.Style.STROKE);
                  arc.setStrokeCap(Paint.Cap.ROUND);
                  glow.setStyle(Paint.Style.STROKE);
                  glow.setStrokeCap(Paint.Cap.ROUND);
                  tick.setStrokeCap(Paint.Cap.ROUND);
                  tBig.setTypeface(Ui.DISPLAY);
                  tBig.setColor(Ui.TEXT);
                  tBig.setTextAlign(Paint.Align.CENTER);
                  tSmall.setTypeface(Ui.BODY);
                  tSmall.setColor(Ui.MUTED);
                  tSmall.setTextAlign(Paint.Align.CENTER);
              }

              public void setProgress(float done, float active, float failed) {
                  this.done = clamp(done);
                  this.active = clamp(active);
                  this.failed = clamp(failed);
                  invalidate();
              }

              public void setCenter(String big, String small) {
                  this.big = big;
                  this.small = small;
                  invalidate();
              }

              public void setSpinning(boolean on) {
                  if (on == spinning) return;
                  spinning = on;
                  if (on) {
                      anim = ValueAnimator.ofFloat(0, 360);
                      anim.setDuration(1800);
                      anim.setRepeatCount(ValueAnimator.INFINITE);
                      anim.setInterpolator(new LinearInterpolator());
                      anim.addUpdateListener(a -> {
                          sweep = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      anim.start();
                  } else if (anim != null) {
                      anim.cancel();
                      anim = null;
                  }
                  invalidate();
              }

              private static float clamp(float v) {
                  return Math.max(0, Math.min(1, v));
              }

              @Override
              protected void onDetachedFromWindow() {
                  super.onDetachedFromWindow();
                  if (anim != null) anim.cancel();
              }

              @Override
              protected void onMeasure(int w, int h) {
                  int size = MeasureSpec.getSize(w);
                  int max = Ui.dp(getContext(), 210);
                  int s = Math.min(size, max);
                  setMeasuredDimension(s, s);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float size = Math.min(getWidth(), getHeight());
                  float cx = getWidth() / 2f, cy = getHeight() / 2f;
                  float stroke = size * 0.055f;
                  float r = size / 2f - stroke * 2.2f;
                  rect.set(cx - r, cy - r, cx + r, cy + r);

                  // skala tik di sisi luar, seperti cakram instrumen
                  float tickIn = r + stroke * 1.0f, tickOut = r + stroke * 1.6f, tickLong = r + stroke * 2.0f;
                  for (int i = 0; i < 60; i++) {
                      double a = Math.toRadians(i * 6 - 90);
                      boolean major = i % 5 == 0;
                      tick.setStrokeWidth(major ? stroke * 0.18f : stroke * 0.10f);
                      tick.setColor(major ? Ui.MUTED : Ui.LINE);
                      float o = major ? tickLong : tickOut;
                      c.drawLine(cx + (float) Math.cos(a) * tickIn, cy + (float) Math.sin(a) * tickIn,
                              cx + (float) Math.cos(a) * o, cy + (float) Math.sin(a) * o, tick);
                  }

                  track.setStrokeWidth(stroke);
                  c.drawArc(rect, 0, 360, false, track);
                  arc.setStrokeWidth(stroke);
                  glow.setStrokeWidth(stroke * 1.6f);
                  glow.setMaskFilter(new BlurMaskFilter(stroke * 1.2f, BlurMaskFilter.Blur.NORMAL));

                  if (spinning) {
                      // ekor sapuan radar yang memudar
                      for (int k = 0; k < 6; k++) {
                          int alpha = 255 - k * 42;
                          arc.setColor(Ui.ION);
                          arc.setAlpha(Math.max(20, alpha));
                          c.drawArc(rect, sweep - 90 - k * 12, 12, false, arc);
                      }
                      glow.setColor(Ui.ION);
                      glow.setAlpha(150);
                      c.drawArc(rect, sweep - 92, 10, false, glow);
                      arc.setAlpha(255);
                  } else {
                      float start = -90;
                      start = seg(c, start, done, Ui.ION);
                      start = seg(c, start, active, Ui.AMBER);
                      seg(c, start, failed, Ui.PULSE);
                  }

                  tBig.setTextSize(size * 0.21f);
                  tSmall.setTextSize(size * 0.065f);
                  float bigY = cy + size * 0.045f;
                  c.drawText(big, cx, bigY, tBig);
                  if (small != null && !small.isEmpty()) {
                      String[] lines = small.split("\n");
                      float y = bigY + size * 0.10f;
                      for (String line : lines) {
                          c.drawText(line, cx, y, tSmall);
                          y += size * 0.08f;
                      }
                  }
              }

              private float seg(Canvas c, float start, float frac, int color) {
                  if (frac <= 0) return start;
                  float sw = Math.max(2, frac * 360);
                  glow.setColor(color);
                  glow.setAlpha(110);
                  c.drawArc(rect, start, sw, false, glow);
                  arc.setColor(color);
                  arc.setAlpha(255);
                  c.drawArc(rect, start, sw, false, arc);
                  return start + frac * 360;
              }
          }
          EOF_FILE

          mkdir -p app/src/main/java/com/example/fcdownloader
          cat > app/src/main/java/com/example/fcdownloader/KeepAliveService.java << 'EOF_FILE'
          package com.example.fcdownloader;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          /**
           * Layanan latar depan: menjaga CPU dan Wi-Fi tetap aktif walau layar mati,
           * dan menampilkan kemajuan di notifikasi. Dipakai selama memindai/mencari video.
           */
          public class KeepAliveService extends Service {
              static final String CHANNEL = "fc_run";
              static final String ACTION_STOP = "com.example.fcdownloader.STOP";
              static final int NOTIF_ID = 11;
              static final long MAX_HOLD_MS = 6L * 60 * 60 * 1000;

              /** Dipasang oleh MainActivity: dijalankan saat tombol Hentikan di notifikasi ditekan. */
              static volatile Runnable stopHook;
              static volatile boolean running;

              private PowerManager.WakeLock wake;
              private WifiManager.WifiLock wifi;

              static void update(Context c, String text, int pct) {
                  Intent i = new Intent(c, KeepAliveService.class);
                  i.putExtra("text", text);
                  i.putExtra("pct", pct);
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i);
                  else c.startService(i);
              }

              static void halt(Context c) {
                  c.stopService(new Intent(c, KeepAliveService.class));
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              @SuppressWarnings("deprecation")
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      final Runnable hook = stopHook;
                      if (hook != null) new Handler(Looper.getMainLooper()).post(hook);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  String text = intent == null ? "Berjalan" : intent.getStringExtra("text");
                  int pct = intent == null ? -1 : intent.getIntExtra("pct", -1);

                  Notification n = build(text == null ? "Berjalan" : text, pct);
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
                  if (!running) {
                      running = true;
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "fcdownloader:run");
                      wake.setReferenceCounted(false);
                      wake.acquire(MAX_HOLD_MS);
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null) {
                          wifi = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "fcdownloader:wifi");
                          wifi.setReferenceCounted(false);
                          wifi.acquire();
                      }
                  }
                  return START_NOT_STICKY;
              }

              @SuppressWarnings("deprecation")
              private Notification build(String text, int pct) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      if (nm.getNotificationChannel(CHANNEL) == null) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL, "Proses unduhan",
                                  NotificationManager.IMPORTANCE_LOW);
                          ch.setDescription("Menjaga pemindaian dan pencarian video tetap berjalan saat layar mati");
                          nm.createNotificationChannel(ch);
                      }
                      b = new Notification.Builder(this, CHANNEL);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                  Intent open = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP
                          | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  Intent stop = new Intent(this, KeepAliveService.class).setAction(ACTION_STOP);
                  PendingIntent openPi = PendingIntent.getActivity(this, 0, open, flags);
                  PendingIntent stopPi = PendingIntent.getService(this, 1, stop, flags);
                  b.setSmallIcon(android.R.drawable.stat_sys_download)
                          .setContentTitle("Filecoster Downloader")
                          .setContentText(text)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setContentIntent(openPi)
                          .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel,
                                  "Hentikan", stopPi).build());
                  if (pct >= 0) b.setProgress(100, Math.min(100, pct), false);
                  else b.setProgress(0, 0, true);
                  return b.build();
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (wake != null && wake.isHeld()) wake.release();
                  if (wifi != null && wifi.isHeld()) wifi.release();
                  super.onDestroy();
              }
          }
          EOF_FILE

