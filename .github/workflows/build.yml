              // ---------------- PEMUTAR ----------------

              void buildPlayer(int index) {
                  String ua = getIntent().getStringExtra(EXTRA_UA);
                  if (ua == null || ua.isEmpty()) ua = "Mozilla/5.0 (Linux; Android " + Build.VERSION.RELEASE + ") FilecosterPlayer";
                  Map<String, String> hdr = new HashMap<>();
                  String ref = getIntent().getStringExtra(EXTRA_REFERER);
                  if (ref != null && !Intent.ACTION_VIEW.equals(getIntent().getAction())) hdr.put("Referer", ref);
                  String first = uris.get(index);
                  if (first.startsWith("http")) {
                      try {
                          String cookie = CookieManager.getInstance().getCookie(first);
                          if (cookie != null && !Intent.ACTION_VIEW.equals(getIntent().getAction())) hdr.put("Cookie", cookie);
                      } catch (Exception ignored) { }
                  }
                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(ua)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(15000)
                          .setReadTimeoutMs(30000)
                          .setDefaultRequestProperties(hdr);
                  DefaultDataSource.Factory ds = new DefaultDataSource.Factory(this, http);
                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(ds))
                          .setSeekBackIncrementMs(STEP_MS)
                          .setSeekForwardIncrementMs(STEP_MS)
                          .build();
                  player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                          .build(), true);
                  player.setHandleAudioBecomingNoisy(true);

                  List<MediaItem> items = new ArrayList<>();
                  for (int i = 0; i < uris.size(); i++) {
                      String u = uris.get(i);
                      MediaItem.Builder mb = new MediaItem.Builder()
                              .setUri(u)
                              .setMediaId(u)
                              .setMediaMetadata(new MediaMetadata.Builder().setTitle(titles.get(i)).build());
                      if (u.toLowerCase(Locale.ROOT).contains(".m3u8")) mb.setMimeType(MimeTypes.APPLICATION_M3U8);
                      items.add(mb.build());
                  }
                  long resume = prefs.getLong(posKey(first), 0);
                  player.setMediaItems(items, index, Math.max(resume, 0));
                  if (resume > 0) showCenter("Melanjutkan dari " + fmt(resume), 2000);
                  player.addListener(new Player.Listener() {
                      @Override
                      public void onIsPlayingChanged(boolean playing) {
                          playBtn.setText(playing ? "II" : "\u25B6");
                          if (playing && controlsShown) {
                              h.removeCallbacks(hider);
                              h.postDelayed(hider, HIDE_MS);
                          }
                      }

                      @Override
                      public void onPlaybackStateChanged(int state) {
                          if (state == Player.STATE_ENDED) {
                              MediaItem m = player.getCurrentMediaItem();
                              if (m != null) prefs.edit().remove(posKey(m.mediaId)).apply();
                              showControls(true);
                          }
                      }

                      @Override
                      public void onMediaItemTransition(MediaItem item, int reason) {
                          updateTitle();
                          if (item != null && reason != Player.MEDIA_ITEM_TRANSITION_REASON_REPEAT) {
                              long p = prefs.getLong(posKey(item.mediaId), 0);
                              if (p > 0) {
                                  player.seekTo(p);
                                  showCenter("Melanjutkan dari " + fmt(p), 2000);
                              }
                          }
                      }

                      @Override
                      public void onPlayerError(PlaybackException e) {
                          showCenter("Tidak bisa memutar video ini\n(" + e.getErrorCodeName() + ")", 6000);
                          showControls(true);
                      }
                  });
                  pv.setPlayer(player);
                  updateTitle();
                  player.prepare();
                  player.play();
              }

              static String posKey(String uri) {
                  return "pos:" + uri;
              }

              void savePos() {
                  if (player == null) return;
                  MediaItem m = player.getCurrentMediaItem();
                  if (m == null) return;
                  long pos = player.getCurrentPosition(), dur = player.getDuration();
                  SharedPreferences.Editor ed = prefs.edit();
                  if (dur > 0 && pos > MIN_RESUME_MS && pos < dur - MIN_RESUME_MS) ed.putLong(posKey(m.mediaId), pos);
                  else ed.remove(posKey(m.mediaId));
                  ed.apply();
              }

              void updateTitle() {
                  int i = player == null ? 0 : player.getCurrentMediaItemIndex();
                  String t = i >= 0 && i < titles.size() ? titles.get(i) : "Video";
                  titleView.setText(uris.size() > 1 ? (i + 1) + "/" + uris.size() + "  " + t : t);
              }

              void updateProgress() {
                  if (player == null) return;
                  long d = player.getDuration(), p = player.getCurrentPosition();
                  if (!userSeeking) {
                      posView.setText(fmt(p));
                      if (d > 0) {
                          seek.setProgress((int) (p * 1000 / d));
                          seek.setSecondaryProgress((int) (player.getBufferedPosition() * 1000 / d));
                      }
                  }
                  durView.setText(d > 0 ? fmt(d) : "--:--");
              }

              void togglePlay() {
                  if (player == null) return;
                  if (player.getPlaybackState() == Player.STATE_ENDED) player.seekTo(0);
                  if (player.isPlaying()) {
                      player.pause();
                      showCenter("Jeda", 800);
                  } else {
                      player.play();
                  }
                  showControls(true);
              }

              void seekBy(long ms) {
                  if (player == null || !player.isCurrentMediaItemSeekable()) return;
                  long d = player.getDuration();
                  long t = Math.max(0, player.getCurrentPosition() + ms);
                  if (d > 0) t = Math.min(t, d);
                  player.seekTo(t);
                  showCenter((ms > 0 ? "+" : "-") + (Math.abs(ms) / 1000) + " dtk", 700);
              }

              void skip(int dir) {
                  if (player == null) return;
                  savePos();
                  if (dir > 0 && player.hasNextMediaItem()) player.seekToNextMediaItem();
                  else if (dir < 0 && player.hasPreviousMediaItem()) player.seekToPreviousMediaItem();
                  else if (dir < 0) player.seekTo(0);
                  else showCenter("Video terakhir", 900);
                  showControls(true);
              }

              void chooseSpeed() {
                  String[] names = new String[SPEEDS.length];
                  for (int i = 0; i < SPEEDS.length; i++) names[i] = speedLabel(SPEEDS[i]) + (i == speedIdx ? "  \u2713" : "");
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle("Kecepatan putar")
                          .setItems(names, (d, w) -> {
                              speedIdx = w;
                              player.setPlaybackSpeed(SPEEDS[w]);
                              speedBtn.setText(speedLabel(SPEEDS[w]));
                              showCenter("Kecepatan " + speedLabel(SPEEDS[w]), 900);
                          })
                          .show();
              }

              static String speedLabel(float s) {
                  return (s == Math.round(s) ? String.valueOf((int) s) : String.valueOf(s)) + "x";
              }

              void chooseTrack(final int type, String title) {
                  if (player == null) return;
                  final List<Tracks.Group> groups = new ArrayList<>();
                  final List<Integer> idx = new ArrayList<>();
                  List<String> names = new ArrayList<>();
                  if (type == C.TRACK_TYPE_TEXT) {
                      boolean off = player.getTrackSelectionParameters().disabledTrackTypes.contains(C.TRACK_TYPE_TEXT);
                      names.add("Mati" + (off ? "  \u2713" : ""));
                      groups.add(null);
                      idx.add(-1);
                  }
                  int n = 0;
                  for (Tracks.Group g : player.getCurrentTracks().getGroups()) {
                      if (g.getType() != type) continue;
                      for (int k = 0; k < g.length; k++) {
                          if (!g.isTrackSupported(k)) continue;
                          n++;
                          names.add(trackName(g.getTrackFormat(k), n) + (g.isTrackSelected(k) ? "  \u2713" : ""));
                          groups.add(g);
                          idx.add(k);
                      }
                  }
                  if (n == 0) {
                      showCenter(type == C.TRACK_TYPE_AUDIO ? "Tidak ada pilihan audio" : "Video ini tidak punya subtitle", 1500);
                      return;
                  }
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title)
                          .setItems(names.toArray(new String[0]), (d, w) -> {
                              TrackSelectionParameters.Builder pb = player.getTrackSelectionParameters().buildUpon();
                              Tracks.Group g = groups.get(w);
                              if (g == null) {
                                  pb.setTrackTypeDisabled(type, true);
                              } else {
                                  pb.setTrackTypeDisabled(type, false)
                                          .setOverrideForType(new TrackSelectionOverride(g.getMediaTrackGroup(), idx.get(w)));
                              }
                              player.setTrackSelectionParameters(pb.build());
                          })
                          .show();
              }

              static String trackName(Format f, int n) {
                  StringBuilder sb = new StringBuilder(f.label != null && !f.label.isEmpty() ? f.label : "Trek " + n);
                  if (f.language != null && !f.language.isEmpty() && !"und".equals(f.language)) {
                      sb.append(" (").append(new Locale(f.language).getDisplayLanguage()).append(")");
                  }
                  if (f.channelCount > 0) sb.append(" \u00B7 ").append(f.channelCount).append(" ch");
                  return sb.toString();
              }

              void cycleResize() {
                  resizeIdx = (resizeIdx + 1) % RESIZE.length;
                  pv.setResizeMode(RESIZE[resizeIdx]);
                  resizeBtn.setText(RESIZE_NAMES[resizeIdx]);
                  prefs.edit().putInt("resize", resizeIdx).apply();
                  showCenter("Layar: " + RESIZE_NAMES[resizeIdx], 900);
                  showControls(true);
              }

              void cycleOrient() {
                  orientIdx = (orientIdx + 1) % ORIENT.length;
                  setRequestedOrientation(ORIENT[orientIdx]);
                  orientBtn.setText(ORIENT_NAMES[orientIdx]);
                  prefs.edit().putInt("orient", orientIdx).apply();
                  showCenter("Arah layar: " + ORIENT_NAMES[orientIdx], 900);
                  showControls(true);
              }

              void setLocked(boolean on) {
                  locked = on;
                  if (on) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LOCKED);
                      showControls(false);
                      showCenter("Layar dikunci", 900);
                      unlockBtn.setVisibility(View.VISIBLE);
                      h.removeCallbacks(unlockHider);
                      h.postDelayed(unlockHider, 2500);
                  } else {
                      setRequestedOrientation(ORIENT[orientIdx]);
                      unlockBtn.setVisibility(View.GONE);
                      showControls(true);
                  }
              }

              void showControls(boolean on) {
                  controlsShown = on && !locked;
                  topBar.setVisibility(controlsShown ? View.VISIBLE : View.GONE);
                  bottomBar.setVisibility(controlsShown ? View.VISIBLE : View.GONE);
                  h.removeCallbacks(hider);
                  if (controlsShown && player != null && player.isPlaying()) h.postDelayed(hider, HIDE_MS);
                  immersive();
              }

              void showCenter(String s, long ms) {
                  center.setText(s);
                  center.setVisibility(View.VISIBLE);
                  h.removeCallbacks(centerHider);
                  if (ms > 0) h.postDelayed(centerHider, ms);
              }

              // ---------------- GESTUR ----------------

              boolean onTouch(View v, MotionEvent e) {
                  if (locked) {
                      if (e.getActionMasked() == MotionEvent.ACTION_UP) {
                          unlockBtn.setVisibility(View.VISIBLE);
                          h.removeCallbacks(unlockHider);
                          h.postDelayed(unlockHider, 2500);
                      }
                      return true;
                  }
                  gd.onTouchEvent(e);
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          downX = e.getX();
                          downY = e.getY();
                          gMode = G_NONE;
                          seekTarget = -1;
                          startPos = player == null ? 0 : player.getCurrentPosition();
                          startVol = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                          startBright = currentBrightness();
                          break;
                      case MotionEvent.ACTION_MOVE: {
                          float dx = e.getX() - downX, dy = e.getY() - downY;
                          if (gMode == G_NONE) {
                              if (Math.abs(dx) > touchSlop * 2 && Math.abs(dx) > Math.abs(dy)) gMode = G_SEEK;
                              else if (Math.abs(dy) > touchSlop * 2) gMode = downX < v.getWidth() / 2f ? G_BRIGHT : G_VOLUME;
                          }
                          if (gMode == G_SEEK) {
                              long d = player == null ? 0 : player.getDuration();
                              if (d <= 0 || !player.isCurrentMediaItemSeekable()) {
                                  showCenter("Video ini tidak bisa digeser", 900);
                                  break;
                              }
                              seekTarget = Math.max(0, Math.min(d, startPos + (long) (dx / Math.max(1, v.getWidth()) * SWIPE_FULL_MS)));
                              long diff = seekTarget - startPos;
                              showCenter((diff >= 0 ? "+" : "-") + fmt(Math.abs(diff)) + "\n" + fmt(seekTarget) + " / " + fmt(d), 0);
                          } else if (gMode == G_VOLUME) {
                              int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                              int vol = Math.round(startVol + (-dy / (v.getHeight() * 0.6f)) * max);
                              vol = Math.max(0, Math.min(max, vol));
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, vol, 0);
                              showCenter("Volume " + (max > 0 ? vol * 100 / max : 0) + "%", 0);
                          } else if (gMode == G_BRIGHT) {
                              float b = Math.max(0.01f, Math.min(1f, startBright + (-dy / (v.getHeight() * 0.6f))));
                              WindowManager.LayoutParams lp = getWindow().getAttributes();
                              lp.screenBrightness = b;
                              getWindow().setAttributes(lp);
                              showCenter("Kecerahan " + Math.round(b * 100) + "%", 0);
                          }
                          break;
                      }
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          if (gMode == G_SEEK && seekTarget >= 0 && player != null) player.seekTo(seekTarget);
                          if (gMode != G_NONE) {
                              h.removeCallbacks(centerHider);
                              h.postDelayed(centerHider, 600);
                          }
                          gMode = G_NONE;
                          break;
                      default:
                          break;
                  }
                  return true;
              }

              float currentBrightness() {
                  float b = getWindow().getAttributes().screenBrightness;
                  if (b >= 0) return b;
                  try {
                      return Settings.System.getInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS) / 255f;
                  } catch (Exception e) {
                      return 0.5f;
                  }
              }

              void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              static String fmt(long ms) {
                  long s = Math.max(0, ms / 1000);
                  long hh = s / 3600, mm = (s % 3600) / 60, ss = s % 60;
                  return hh > 0 ? String.format(Locale.ROOT, "%d:%02d:%02d", hh, mm, ss) : String.format(Locale.ROOT, "%02d:%02d", mm, ss);
              }

              // ---------------- SIKLUS HIDUP ----------------

              @Override
              public void onWindowFocusChanged(boolean focus) {
                  super.onWindowFocusChanged(focus);
                  if (focus) immersive();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  savePos();
                  if (player != null) player.pause();
              }

              @Override
              protected void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  if (player != null) {
                      player.release();
                      player = null;
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (locked) {
                      unlockBtn.setVisibility(View.VISIBLE);
                      h.removeCallbacks(unlockHider);
                      h.postDelayed(unlockHider, 2500);
                      return;
                  }
                  super.onBackPressed();
              }
          }
