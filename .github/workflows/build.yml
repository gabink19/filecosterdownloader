              void paintRow(int i) {
                  if (i < 0 || i >= rowChips.size()) return;
                  TextView chip = rowChips.get(i);
                  switch (vState[i]) {
                      case ST_SEARCH: Ui.setChip(this, chip, "Mencari", Ui.AMBER); break;
                      case ST_QUEUED: Ui.setChip(this, chip, "Antre", Ui.AMBER); break;
                      case ST_DL: Ui.setChip(this, chip, vPct[i] >= 0 ? vPct[i] + "%" : "Mengunduh", Ui.AMBER); break;
                      case ST_READY: Ui.setChip(this, chip, "Link siap", Ui.TEXT); break;
                      case ST_DONE: Ui.setChip(this, chip, doneUri.containsKey(i) ? "\u25B6 Putar" : "Selesai", Ui.ION); break;
                      case ST_FAIL: Ui.setChip(this, chip, "Gagal", Ui.PULSE); break;
                      default: Ui.setChip(this, chip, "Menunggu", Ui.MUTED);
                  }
                  TextView note = rowNotes.get(i);
                  String n = vNote[i];
                  note.setText(n == null ? "" : n);
                  note.setTextColor(vState[i] == ST_FAIL ? Ui.PULSE : Ui.MUTED);
                  note.setVisibility(n == null || n.isEmpty() ? View.GONE : View.VISIBLE);
              }

              void setState(int i, int st, String note) {
                  if (i < 0 || i >= vState.length) return;
                  vState[i] = st;
                  vNote[i] = note;
                  paintRow(i);
              }


